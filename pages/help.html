<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>帮助中心</title>
</head>
<body>
    <div style="padding:20px;">
        <h1>帮助中心</h1>
        <hr>
        <h3>功能介绍</h3>
        <ul>
            <li><strong>用户注册</strong> — 新用户可在注册页面创建账号</li>
            <li><strong>登录系统</strong> — 使用用户名和密码登录</li>
            <li><strong>个人中心</strong> — 查看用户资料和余额信息</li>
            <li><strong>充值功能</strong> — 为账户充值（仅支持正数金额）</li>
            <li><strong>用户搜索</strong> — 通过用户名或邮箱搜索用户</li>
            <li><strong>头像上传</strong> — 上传个人头像图片</li>
        </ul>
        <h3>常见问题</h3>
        <ol>
            <li>如何修改密码？—— 目前暂不支持修改密码功能</li>
            <li>充值后余额未更新？—— 请刷新页面重新查看</li>
            <li>无法上传文件？—— 仅支持 png、jpg、gif、webp、bmp 格式图片</li>
        </ol>
    </div>
</body>
</html>
