<div class="help-container">
    <div class="help-header">
        <span class="help-icon">📖</span>
        <h2>帮助中心</h2>
    </div>

    <div class="help-section">
        <h3>✨ 功能介绍</h3>
        <ul class="help-list">
            <li><strong>用户注册</strong> — 创建新账号加入系统</li>
            <li><strong>登录系统</strong> — 使用用户名和密码登录</li>
            <li><strong>个人中心</strong> — 查看和管理个人资料与余额</li>
            <li><strong>充值功能</strong> — 为账户充值（仅支持正数金额）</li>
            <li><strong>用户搜索</strong> — 通过用户名或邮箱搜索其他用户</li>
            <li><strong>头像上传</strong> — 上传个人头像，仅支持图片格式</li>
        </ul>
    </div>

    <div class="help-section">
        <h3>❓ 常见问题</h3>
        <ul class="help-list">
            <li><strong>如何修改密码？</strong> — 目前暂不支持修改密码功能</li>
            <li><strong>充值后余额未更新？</strong> — 请刷新页面重新查看</li>
            <li><strong>无法上传文件？</strong> — 仅支持 png、jpg、gif、webp、bmp 格式图片</li>
        </ul>
    </div>
</div>
