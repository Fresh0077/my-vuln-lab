{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>个人中心</h2>
    {% if error %}
        <div class="error-msg">{{ error }}</div>
    {% endif %}
    <ul class="user-info-list">
        <li><span class="label">ID：</span>{{ user.id }}</li>
        <li><span class="label">用户名：</span>{{ user.username }}</li>
        <li><span class="label">邮箱：</span>{{ user.email }}</li>
        <li><span class="label">手机：</span>{{ user.phone }}</li>
        <li><span class="label">角色：</span>{{ user.role }}</li>
        <li><span class="label">余额：</span>{{ user.balance }}</li>
    </ul>
</div>

<div class="card">
    <h2>充值</h2>
    <form method="post" action="/recharge" class="login-form">
        <div class="form-group">
            <label for="amount">充值金额</label>
            <input type="number" id="amount" name="amount" placeholder="请输入充值金额" required>
        </div>
        <button type="submit" class="btn">充值</button>
    </form>
</div>

<div class="card">
    <h2>修改密码</h2>
    <form method="post" action="/change-password" class="login-form">
        <input type="hidden" name="username" value="{{ user.username }}">
        <div class="form-group">
            <label for="new_password">新密码</label>
            <input type="password" id="new_password" name="new_password" placeholder="请输入新密码" required minlength="1">
        </div>
        <div class="form-group">
            <label for="confirm">确认新密码</label>
            <input type="password" id="confirm" name="confirm" placeholder="请再次输入新密码" required minlength="1">
        </div>
        <button type="submit" class="btn">修改密码</button>
    </form>
</div>
{% endblock %}
